<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock del almacén</title>
<style>
:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #18212b; --muted: #5b6672; --line: #d5dbe1;
  --accent: #2a47d6; --accent-ink: #ffffff;
  --hero-bg: #1f3ac0; --hero-ink: #ffffff;
  --ok: #1f7a55; --ok-bg: #dff1e8;
  --low: #7a5000; --low-bg: #fbe8bd;
  --out: #a52a22; --out-bg: #f8d9d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161d; --surface: #18212b; --ink: #e8edf2; --muted: #9aa6b2; --line: #2c3844;
    --accent: #8aa0ff; --accent-ink: #0b1020;
    --hero-bg: #1a2766; --hero-ink: #ffffff;
    --ok: #6fd1a2; --ok-bg: #16372a;
    --low: #f0c35c; --low-bg: #3b2d0c;
    --out: #ff9b92; --out-bg: #43201d;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hero { background: var(--hero-bg); color: var(--hero-ink); padding: 3rem 1.25rem 2.5rem; }
.wrap { max-width: 760px; margin: 0 auto; }
h1 {
  margin: 0 0 .75rem; font-size: clamp(2.4rem, 8vw, 4.2rem);
  font-weight: 800; letter-spacing: -.035em; line-height: 1;
}
.lead { margin: 0 0 1.5rem; max-width: 52ch; font-size: 1.125rem; opacity: .9; }
#summary { margin: 0; padding-left: .9rem; border-left: 4px solid currentColor; font-weight: 600; }

main { padding: 1.5rem 1.25rem 3rem; }
h2 { margin: 2rem 0 .75rem; font-size: 1.25rem; letter-spacing: -.01em; }
h2:first-child { margin-top: 0; }

form {
  display: grid; gap: .75rem 1rem; align-items: end;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.name-field { grid-column: 1 / -1; }
label { display: grid; gap: .25rem; font-size: .875rem; color: var(--muted); }
input {
  width: 100%; padding: .6rem .7rem; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
}
button { font: inherit; cursor: pointer; }
.primary {
  min-height: 2.6rem; padding: .6rem 1rem; font-weight: 600;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px;
}
.primary:hover { filter: brightness(1.1); }

#list { margin: 0; padding: 0; list-style: none; display: grid; gap: .5rem; }
.item {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: .5rem 1rem; align-items: center;
  padding: .75rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.info { display: grid; }
.min { font-size: .875rem; color: var(--muted); }
.chip { padding: .15rem .6rem; font-size: .875rem; font-weight: 600; border-radius: 999px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.low { background: var(--low-bg); color: var(--low); }
.chip.out { background: var(--out-bg); color: var(--out); }
.qty { display: flex; align-items: center; gap: .5rem; }
.qty button {
  width: 2.5rem; height: 2.5rem; font-size: 1.25rem; line-height: 1;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
}
.qty button:hover { border-color: var(--accent); }
.qty output { min-width: 2.5ch; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.del { min-height: 2.5rem; padding: 0 .5rem; color: var(--muted); background: none; border: 0; text-decoration: underline; }
.del:hover { color: var(--out); }
.empty { padding: 1.5rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }

@media (max-width: 600px) {
  .item { grid-template-columns: 1fr auto; }
  .del { justify-self: end; }
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Stock del almacén</h1>
    <p class="lead">Registra lo que entra y lo que sale. Los productos que llegan a su mínimo se marcan para que sepas qué reponer.</p>
    <p id="summary" aria-live="polite"></p>
  </div>
</header>

<main class="wrap">
  <h2>Nuevo producto</h2>
  <form id="form">
    <label class="name-field">Producto
      <input id="name" required maxlength="60" autocomplete="off" placeholder="Ej.: Yerba mate 1 kg">
    </label>
    <label>Cantidad
      <input id="qty" type="number" min="0" value="0" inputmode="numeric">
    </label>
    <label>Mínimo
      <input id="min" type="number" min="0" value="5" inputmode="numeric">
    </label>
    <button class="primary" type="submit">Agregar producto</button>
  </form>

  <h2>Productos</h2>
  <ul id="list"></ul>
</main>

<script>
const KEY = 'stock-almacen-v1';
const seed = [
  { id: 1, name: 'Yerba mate 1 kg', qty: 24, min: 10 },
  { id: 2, name: 'Fideos secos 500 g', qty: 8, min: 12 },
  { id: 3, name: 'Aceite de girasol 900 ml', qty: 0, min: 6 },
  { id: 4, name: 'Galletitas de agua', qty: 40, min: 15 }
];

function load() {
  try {
    const data = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(data)) return data;
  } catch (e) {}
  return seed.map(p => ({ ...p }));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
}

let items = load();
const $ = s => document.querySelector(s);
const list = $('#list'), summary = $('#summary'), form = $('#form');
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function status(p) {
  if (p.qty <= 0) return ['out', 'Agotado'];
  if (p.qty <= p.min) return ['low', 'Reponer'];
  return ['ok', 'Disponible'];
}

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'class') n.className = v;
    else n.setAttribute(k, v);
  }
  n.append(...kids);
  return n;
}

function render() {
  list.replaceChildren();
  if (!items.length) {
    list.append(el('li', { class: 'empty', text: 'Aún no hay productos. Agrega el primero con el formulario.' }));
  }
  for (const p of items) {
    const [cls, label] = status(p);
    list.append(el('li', { class: 'item', 'data-id': p.id },
      el('div', { class: 'info' },
        el('strong', { text: p.name }),
        el('span', { class: 'min', text: `Mínimo: ${p.min}` })),
      el('span', { class: 'chip ' + cls, text: label }),
      el('div', { class: 'qty' },
        el('button', { type: 'button', 'data-act': 'dec', 'aria-label': `Quitar una unidad de ${p.name}`, text: '−' }),
        el('output', { 'aria-label': `Cantidad de ${p.name}`, text: String(p.qty) }),
        el('button', { type: 'button', 'data-act': 'inc', 'aria-label': `Agregar una unidad de ${p.name}`, text: '+' })),
      el('button', { type: 'button', class: 'del', 'data-act': 'del', 'aria-label': `Eliminar ${p.name}`, text: 'Eliminar' })
    ));
  }
  const units = items.reduce((sum, p) => sum + p.qty, 0);
  const need = items.filter(p => p.qty <= p.min).length;
  summary.textContent = `Tienes ${plural(items.length, 'producto', 'productos')} y ${plural(units, 'unidad', 'unidades')} en total. ` +
    (need ? `${plural(need, 'necesita', 'necesitan')} reposición.` : 'Todo está por encima del mínimo.');
}

list.addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = Number(btn.closest('.item').dataset.id);
  const p = items.find(x => x.id === id);
  if (btn.dataset.act === 'inc') p.qty++;
  if (btn.dataset.act === 'dec') p.qty = Math.max(0, p.qty - 1);
  if (btn.dataset.act === 'del') items = items.filter(x => x.id !== id);
  save();
  render();
});

form.addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#name').value.trim();
  if (!name) return;
  const toInt = v => Math.max(0, parseInt(v, 10) || 0);
  items.push({ id: Date.now(), name, qty: toInt($('#qty').value), min: toInt($('#min').value) });
  save();
  render();
  form.reset();
  $('#name').focus();
});

render();
</script>
</body>
</html>
